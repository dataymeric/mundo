[project]
name = "mundo"
version = "0.1.0"
description = "MUNDO: A multiresolution generative framework for temporal downscaling"
readme = "README.md"
authors = [
    { name = "Aymeric Delefosse" },
    { name = "Manon Tavernier" },
]
maintainers = [{ name = "Aymeric Delefosse" }]
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.17",
    "h5py>=3.12",
    "torch>=2.10",
    "hydra-core>=1.4.0rc1",
    "omegaconf>=2.3",
    "hdf5plugin",
    "einops>=0.8",
    "timm>=1.0",
    "cftime",
    "rich>=13",
    "tensorboard>=2.17",
    "natten>=0.21.7",
]

[project.optional-dependencies]
slurm = ["hydra-submitit-launcher>=1.2"]
# scripts/data/make_era5.py
data = ["xarray", "zarr>=3", "gcsfs", "dask", "h5netcdf"]

[project.scripts]
mundo-train = "mundo.train:main"
mundo-eval = "mundo.eval:main"

[project.urls]
Repository = "https://github.com/dataymeric/mundo"

[dependency-groups]
cpu = ["torch>=2.10", "torchvision>=0.25"]
# libnatten ships one wheel per torch and CUDA build
cu126 = ["torch==2.13.*", "torchvision>=0.25", "natten==0.21.7+torch2130cu126"]

[tool.uv]
default-groups = ["cu126"]
conflicts = [[{ group = "cpu" }, { group = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
]
natten = { index = "natten", group = "cu126" }
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "natten"
url = "https://whl.natten.org"
format = "flat"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mundo"]
